name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForbiddenBuster

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean test jar --no-daemon

      - name: Record artifact provenance
        run: |
          echo "${{ github.event.pull_request.head.sha || github.sha }}" > build/libs/SOURCE_COMMIT.txt
          sha256sum build/libs/ForbiddenBuster.jar | tee build/libs/ForbiddenBuster.jar.sha256

      - name: Upload extension JAR
        uses: actions/upload-artifact@v4
        with:
          name: ForbiddenBuster-v8-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ForbiddenBuster/build/libs/ForbiddenBuster.jar
            ForbiddenBuster/build/libs/ForbiddenBuster.jar.sha256
            ForbiddenBuster/build/libs/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Show test failure details
        if: failure()
        run: |
          if [ -d build/test-results/test ]; then
            find build/test-results/test -type f -name '*.xml' -print -exec cat {} \;
          fi
