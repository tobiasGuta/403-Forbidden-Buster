name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForbiddenBuster

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean test jar --no-daemon

      - name: Show test failure details
        if: failure()
        run: |
          if [ -d build/test-results/test ]; then
            find build/test-results/test -type f -name '*.xml' -print -exec cat {} \;
          fi
